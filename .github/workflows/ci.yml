name: Orbit CI & Automated Quality Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify Code Quality & Linting
        run: npm run lint

      - name: Run Automated Vitest Test Suites
        run: npm test

      - name: Verify Production Build
        run: npm run build
